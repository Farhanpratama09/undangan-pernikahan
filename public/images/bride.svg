<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_bride" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D221E" />
      <stop offset="100%" stop-color="#181311" />
    </linearGradient>
    <pattern id="noise_bride" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.5" fill="#EAE6DF" opacity="0.1" />
      <circle cx="15" cy="11" r="0.5" fill="#EAE6DF" opacity="0.15" />
      <circle cx="9" cy="18" r="0.5" fill="#EAE6DF" opacity="0.08" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg_bride)" />
  <rect width="100%" height="100%" fill="url(#noise_bride)" />
  
  <!-- Subtle Framing Line -->
  <rect x="30" y="30" width="540" height="740" fill="none" stroke="#D4AF37" stroke-width="0.75" opacity="0.6" />
  
  <!-- Silhouette Art -->
  <g transform="translate(300, 370)" stroke="#D4AF37" stroke-width="1.2" fill="none" opacity="0.85">
    <!-- Bride Veil & Head Contour -->
    <path d="M 0,-145 C -40,-145 -55,-105 -55,-60 C -55,-15 -25,10 0,20 C 25,10 55,-15 55,-60 C 55,-105 40,-145 0,-145 Z" />
    <!-- Veil drape -->
    <path d="M -50,-100 C -120,0 -150,120 -150,190" stroke-dasharray="4 2" />
    <path d="M 50,-100 C 120,0 150,120 150,190" stroke-dasharray="4 2" />
    <!-- Shoulders & Gown neckline -->
    <path d="M -55,0 C -90,25 -140,80 -150,190 L 150,190 C 140,80 90,25 55,0" />
    <path d="M -35,25 Q 0,65 35,25" />
  </g>

  <!-- Typography -->
  <text x="300" y="630" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" letter-spacing="4" text-anchor="middle" fill="#EAE6DF">KIRANA LARASATI</text>
  <text x="300" y="660" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="3" text-anchor="middle" fill="#D4AF37">THE BRIDE • EDITORIAL PORTRAIT</text>
</svg>
