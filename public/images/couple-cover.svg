<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1E1B" />
      <stop offset="50%" stop-color="#141413" />
      <stop offset="100%" stop-color="#0B0B0C" />
    </linearGradient>
    <pattern id="noise_cover" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="0.7" fill="#EAE6DF" opacity="0.1" />
      <circle cx="20" cy="18" r="0.7" fill="#EAE6DF" opacity="0.15" />
      <circle cx="12" cy="28" r="0.7" fill="#EAE6DF" opacity="0.08" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg_cover)" />
  <rect width="100%" height="100%" fill="url(#noise_cover)" />

  <!-- Architectural Hairline Frame -->
  <rect x="40" y="40" width="1120" height="820" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.4" />
  <rect x="46" y="46" width="1108" height="808" fill="none" stroke="#EAE6DF" stroke-width="0.5" opacity="0.2" />

  <!-- Stylized Geometric Motif -->
  <g transform="translate(600, 360)" stroke="#D4AF37" fill="none" opacity="0.8">
    <circle cx="0" cy="0" r="140" stroke-width="0.8" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="110" stroke-width="1.2" />
    <path d="M -70,0 L 70,0 M 0,-70 L 0,70" stroke-width="0.8" />
    <polygon points="0,-90 64,0 0,90 -64,0" stroke-width="1" />
    <!-- Monogram letters -->
    <text x="0" y="14" font-family="'Cormorant Garamond', Georgia, serif" font-size="44" font-weight="400" letter-spacing="6" text-anchor="middle" fill="#EAE6DF" stroke="none">A &amp; K</text>
  </g>

  <!-- Editorial Headings -->
  <text x="600" y="580" font-family="'Cormorant Garamond', Georgia, serif" font-size="52" font-weight="300" letter-spacing="8" text-anchor="middle" fill="#F8F6F2">THE CELEBRATION OF UNION</text>
  <text x="600" y="625" font-family="'JetBrains Mono', monospace" font-size="14" letter-spacing="6" text-anchor="middle" fill="#D4AF37">ARYA SATRIA &amp; KIRANA LARASATI</text>
  <text x="600" y="660" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="4" text-anchor="middle" fill="#78756F">JAKARTA, 12 DESEMBER 2026</text>
</svg>
