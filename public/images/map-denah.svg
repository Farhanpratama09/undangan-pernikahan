<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%" style="background:#FBF9F5; font-family:'Courier New', monospace, sans-serif;">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#E5E0D8" stroke-width="0.75" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#141413" />
    </marker>
  </defs>

  <!-- Background Grid -->
  <rect width="100%" height="100%" fill="#FBF9F5" />
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.6" />

  <!-- Outer Architectural Border -->
  <rect x="25" y="25" width="850" height="600" fill="none" stroke="#141413" stroke-width="2" />
  <rect x="30" y="30" width="840" height="590" fill="none" stroke="#141413" stroke-width="0.75" stroke-dasharray="4 2" />

  <!-- Header / Architectural Title Block -->
  <g transform="translate(50, 65)">
    <text x="0" y="0" font-size="20" font-weight="700" letter-spacing="3" fill="#141413">THE MAJESTIC GLASS HOUSE</text>
    <text x="0" y="22" font-size="11" letter-spacing="1.5" fill="#78756F">SITE PLAN &amp; ACCESS ROUTE SPECIFICATION • SCALE 1:250</text>
    <text x="0" y="38" font-size="10" letter-spacing="1" fill="#78756F">COORDINATES: 6°15'32.4"S 106°47'58.2"E • JAKARTA SELATAN</text>
  </g>

  <!-- North Compass -->
  <g transform="translate(810, 80)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#141413" stroke-width="1.2" />
    <polygon points="0,-18 5,0 0,-4 -5,0" fill="#141413" />
    <polygon points="0,18 5,0 0,4 -5,0" fill="#E5E0D8" stroke="#141413" stroke-width="0.8" />
    <text x="0" y="-23" font-size="12" font-weight="700" text-anchor="middle" fill="#141413">N</text>
  </g>

  <!-- Main Road (Jl. Dharmawangsa Raya) -->
  <g>
    <path d="M 60 520 L 840 520" stroke="#141413" stroke-width="28" stroke-linecap="square" />
    <path d="M 60 520 L 840 520" stroke="#FBF9F5" stroke-width="2" stroke-dasharray="16 12" />
    <text x="450" y="555" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle" fill="#141413">JL. DHARMAWANGSA UTAMA (MAIN BOULEVARD)</text>
  </g>

  <!-- Entrance Gate & Driveway -->
  <g>
    <path d="M 400 506 L 400 420 Q 400 370 470 370 L 600 370" fill="none" stroke="#D4AF37" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrow)" />
    <rect x="365" y="475" width="70" height="24" fill="#FFFFFF" stroke="#141413" stroke-width="1.2" />
    <text x="400" y="491" font-size="9" font-weight="700" text-anchor="middle" fill="#141413">MAIN GATE</text>
  </g>

  <!-- Main Venue Structure / Glasshouse -->
  <g transform="translate(110, 140)">
    <!-- Main Hall Building -->
    <rect x="0" y="0" width="480" height="240" fill="#FFFFFF" stroke="#141413" stroke-width="2" />
    
    <!-- Stage Area -->
    <rect x="20" y="20" width="440" height="50" fill="#F4F1EA" stroke="#141413" stroke-width="1" />
    <text x="240" y="50" font-size="12" font-weight="700" letter-spacing="3" text-anchor="middle" fill="#141413">PELAMINAN &amp; UTAMA STAGE</text>

    <!-- Guest Seating Area Grid -->
    <g transform="translate(60, 95)">
      <circle cx="40" cy="30" r="18" fill="none" stroke="#78756F" stroke-width="1.2" stroke-dasharray="3 2" />
      <text x="40" y="34" font-size="9" text-anchor="middle" fill="#78756F">VIP 01</text>

      <circle cx="140" cy="30" r="18" fill="none" stroke="#78756F" stroke-width="1.2" stroke-dasharray="3 2" />
      <text x="140" y="34" font-size="9" text-anchor="middle" fill="#78756F">VIP 02</text>

      <circle cx="240" cy="30" r="18" fill="none" stroke="#78756F" stroke-width="1.2" stroke-dasharray="3 2" />
      <text x="240" y="34" font-size="9" text-anchor="middle" fill="#78756F">VIP 03</text>

      <circle cx="340" cy="30" r="18" fill="none" stroke="#78756F" stroke-width="1.2" stroke-dasharray="3 2" />
      <text x="340" y="34" font-size="9" text-anchor="middle" fill="#78756F">VIP 04</text>

      <circle cx="90" cy="85" r="18" fill="none" stroke="#78756F" stroke-width="1.2" stroke-dasharray="3 2" />
      <text x="90" y="89" font-size="9" text-anchor="middle" fill="#78756F">A-01</text>

      <circle cx="190" cy="85" r="18" fill="none" stroke="#78756F" stroke-width="1.2" stroke-dasharray="3 2" />
      <text x="190" y="89" font-size="9" text-anchor="middle" fill="#78756F">A-02</text>

      <circle cx="290" cy="85" r="18" fill="none" stroke="#78756F" stroke-width="1.2" stroke-dasharray="3 2" />
      <text x="290" y="89" font-size="9" text-anchor="middle" fill="#78756F">A-03</text>
    </g>

    <!-- Foyer & Registration -->
    <rect x="0" y="240" width="220" height="60" fill="#FBF9F5" stroke="#141413" stroke-width="1.5" />
    <text x="110" y="275" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle" fill="#141413">FOYER / REGISTRATION</text>

    <!-- Photo Booth Zone -->
    <rect x="260" y="240" width="220" height="60" fill="#F4F1EA" stroke="#141413" stroke-width="1.5" />
    <text x="370" y="275" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle" fill="#141413">PHOTO GALLERY &amp; BOOTH</text>
  </g>

  <!-- Parking & Valet Zone -->
  <g transform="translate(630, 140)">
    <rect x="0" y="0" width="190" height="200" fill="#ECE7DE" stroke="#141413" stroke-width="1.5" stroke-dasharray="6 3" />
    <text x="95" y="90" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle" fill="#141413">PARKING AREA</text>
    <text x="95" y="110" font-size="9" text-anchor="middle" fill="#78756F">CAPACITY 250 VEHICLES</text>
    
    <rect x="25" y="140" width="140" height="36" fill="#141413" />
    <text x="95" y="162" font-size="9" font-weight="700" letter-spacing="1" text-anchor="middle" fill="#FBF9F5">DROP-OFF &amp; VALET</text>
  </g>

  <!-- Legend Block -->
  <g transform="translate(60, 580)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#D4AF37" stroke-width="3" stroke-dasharray="6 4" />
    <text x="38" y="4" font-size="9" fill="#141413">Alur Masuk Tamu (Drop-off)</text>

    <rect x="220" y="-8" width="16" height="16" fill="#ECE7DE" stroke="#141413" stroke-width="1" />
    <text x="244" y="4" font-size="9" fill="#141413">Area Parkir &amp; Valet</text>

    <rect x="420" y="-8" width="16" height="16" fill="#FFFFFF" stroke="#141413" stroke-width="1" />
    <text x="444" y="4" font-size="9" fill="#141413">Grand Glass Ballroom</text>

    <text x="730" y="4" font-size="9" font-weight="700" text-anchor="end" fill="#78756F">OFFICIAL ARCHITECTURAL MAP</text>
  </g>
</svg>
